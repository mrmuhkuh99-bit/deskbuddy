<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeskBuddy Pixel Studio</title>
  <style>
    :root {
      --bg: #0f111a;
      --card: #1a1d2e;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --danger: #ff0844;
      --text: #ffffff;
      --text-dim: #8b9bb4;
      --bezel: #242938;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }
    p.sub {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .viewport-wrapper {
      position: relative;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: radial-gradient(circle, #151821 0%, #08090d 100%);
      box-shadow: 0 0 0 12px var(--bezel), 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 14px;
      touch-action: none;
    }
    canvas#pixelCanvas {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      image-rendering: pixelated;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .palette-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }
    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-swatch.active {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 8px 6px;
      border-radius: 8px;
      border: none;
      background: #2b3248;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      background: #3a4360;
    }
    button.primary {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
    }
    button.save-btn {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #05160e;
    }

    .save-box {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    input#faceName {
      flex: 1;
      background: #0f111a;
      border: 1px solid #2b3248;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }
    input#faceName:focus {
      border-color: var(--accent);
    }

    .presets-title {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .presets-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .preset-btn {
      flex: 0 0 auto;
      padding: 6px 10px;
      background: #222738;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .custom-pill {
      background: #1f333a;
      border: 1px solid var(--accent);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .custom-pill span.del {
      color: var(--danger);
      font-weight: bold;
      padding-left: 2px;
    }

    .warning-msg {
      background: rgba(255, 8, 68, 0.15);
      border: 1px solid var(--danger);
      color: #ff99aa;
      font-size: 0.75rem;
      padding: 8px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>DESKBUDDY STUDIO</h1>
    <p class="sub">1.28" Round Display Editor (24x24 Raster)</p>
  </header>

  <div class="viewport-wrapper">
    <canvas id="pixelCanvas" width="24" height="24"></canvas>
  </div>

  <div class="controls">
    <div id="warningBox" class="warning-msg"></div>

    <div class="palette-row" id="palette"></div>

    <div class="btn-row">
      <button id="btnPen" class="primary">Stift</button>
      <button id="btnEraser">Radierer</button>
      <button id="btnClear">Leeren</button>
    </div>

    <div class="save-box">
      <input type="text" id="faceName" placeholder="Name für dein Face..." maxlength="16" autocomplete="off">
      <button class="save-btn" onclick="saveFace()">Speichern</button>
    </div>

    <div class="presets-title">Meine Gesichter</div>
    <div class="presets-row" id="customList">
      <span style="font-size: 0.75rem; color: var(--text-dim); padding: 4px;">Noch keine eigenen Faces.</span>
    </div>

    <div class="presets-title">Standard-Vorlagen</div>
    <div class="presets-row">
      <button class="preset-btn" onclick="loadPreset('classic')">Standard</button>
      <button class="preset-btn" onclick="loadPreset('happy')">Happy</button>
      <button class="preset-btn" onclick="loadPreset('laser')">Fokus</button>
      <button class="preset-btn" onclick="loadPreset('cat')">Kätzchen</button>
    </div>

    <button class="primary" style="margin-top: 4px;" onclick="exportData()">Export für ESP32</button>
  </div>

  <script>
    const GRID_SIZE = 24;
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const warningBox = document.getElementById('warningBox');

    const PALETTE = [
      '#00f2fe', '#4facfe', '#00ff87', '#ff0844', 
      '#ffb199', '#f6d365', '#ffffff', '#000000'
    ];
    let currentColor = PALETTE[0];
    let isDrawing = false;
    let isErasing = false;

    let grid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill('#000000'));

    const palContainer = document.getElementById('palette');
    PALETTE.forEach((c, idx) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (idx === 0 ? ' active' : '');
      swatch.style.background = c;
      swatch.onclick = () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        currentColor = c;
        setTool('pen');
      };
      palContainer.appendChild(swatch);
    });

    function setTool(tool) {
      isErasing = (tool === 'eraser');
      document.getElementById('btnPen').className = isErasing ? '' : 'primary';
      document.getElementById('btnEraser').className = isErasing ? 'primary' : '';
    }

    document.getElementById('btnPen').onclick = () => setTool('pen');
    document.getElementById('btnEraser').onclick = () => setTool('eraser');
    document.getElementById('btnClear').onclick = () => {
      grid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill('#000000'));
      hideWarning();
      render();
    };

    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);

      const r = GRID_SIZE / 2;
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const dist = Math.hypot(x + 0.5 - r, y + 0.5 - r);
          if (dist <= r - 0.2) {
            ctx.fillStyle = grid[y][x];
            ctx.fillRect(x, y, 1, 1);
          } else {
            ctx.fillStyle = '#0a0c10';
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    }

    function drawPixel(e) {
      hideWarning();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scale = GRID_SIZE / rect.width;
      const x = Math.floor((clientX - rect.left) * scale);
      const y = Math.floor((clientY - rect.top) * scale);

      if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
        const dist = Math.hypot(x + 0.5 - (GRID_SIZE / 2), y + 0.5 - (GRID_SIZE / 2));
        if (dist <= (GRID_SIZE / 2) - 0.2) {
          grid[y][x] = isErasing ? '#000000' : currentColor;
          render();
        }
      }
    }

    canvas.addEventListener('pointerdown', (e) => { isDrawing = true; drawPixel(e); });
    window.addEventListener('pointermove', (e) => { if (isDrawing) drawPixel(e); });
    window.addEventListener('pointerup', () => { isDrawing = false; });

    function showWarning(msg) {
      warningBox.textContent = msg;
      warningBox.style.display = 'block';
    }
    function hideWarning() {
      warningBox.style.display = 'none';
    }

    /* --- FILTER 1: Namensprüfung --- */
    const FORBIDDEN_WORDS = [
      'hitler', 'nazi', 'ss', 'sa', 'hakenkreuz', 'swastika', 'nsdap', 'aryan',
      'whore', 'hure', 'fuck', 'fick', 'arsch', 'penis', 'cock', 'pussy', 
      'fotze', 'nigger', 'neger', 'kanake', 'bastard', 'spast'
    ];

    function validateName(name) {
      const clean = name.trim();
      if (clean.length < 2) return "Der Name muss mindestens 2 Zeichen lang sein.";
      if (!/^[a-zA-Z0-9äöüÄÖÜß _-]+$/.test(clean)) return "Nur Buchstaben, Zahlen und Bindestriche erlaubt.";

      const lower = clean.toLowerCase().replace(/[^a-z0-9]/g, '');
      for (const bad of FORBIDDEN_WORDS) {
        if (lower.includes(bad)) {
          return "Dieser Name verstößt gegen die Richtlinien.";
        }
      }
      return null;
    }

    /* --- FILTER 2: Geometrische Erkennung (Hakenkreuze & Runen) --- */
    function checkProhibitedPatterns() {
      const b = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
      let totalPixels = 0;

      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          if (grid[y][x] !== '#000000') {
            b[y][x] = 1;
            totalPixels++;
          }
        }
      }

      if (totalPixels < 8) return null;

      // Gerade Hakenkreuze (Armlänge 2 bis 5)
      for (let cy = 3; cy < GRID_SIZE - 3; cy++) {
        for (let cx = 3; cx < GRID_SIZE - 3; cx++) {
          if (!b[cy][cx]) continue;

          for (let L = 2; L <= 5; L++) {
            if (cx - L < 0 || cx + L >= GRID_SIZE || cy - L < 0 || cy + L >= GRID_SIZE) continue;

            const crossH = b[cy][cx - L] && b[cy][cx - 1] && b[cy][cx + 1] && b[cy][cx + L];
            const crossV = b[cy - L][cx] && b[cy - 1][cx] && b[cy + 1][cx] && b[cy + L][cx];

            if (crossH && crossV) {
              const cw = b[cy - L][cx + 1] && b[cy + L][cx - 1] && b[cy + 1][cx + L] && b[cy - 1][cx - L];
              const ccw = b[cy - L][cx - 1] && b[cy + L][cx + 1] && b[cy - 1][cx + L] && b[cy + 1][cx - L];

              if (cw || ccw) {
                return "Unzulässiges Symbol erkannt (Hakenkreuz-Muster). Speichern verweigert.";
              }
            }
          }
        }
      }

      // Diagonale / 45°-Hakenkreuze
      for (let cy = 4; cy < GRID_SIZE - 4; cy++) {
        for (let cx = 4; cx < GRID_SIZE - 4; cx++) {
          if (!b[cy][cx]) continue;

          const diag1 = b[cy - 2][cx - 2] && b[cy - 1][cx - 1] && b[cy + 1][cx + 1] && b[cy + 2][cx + 2];
          const diag2 = b[cy - 2][cx + 2] && b[cy - 1][cx + 1] && b[cy + 1][cx - 1] && b[cy + 2][cx - 2];

          if (diag1 && diag2) {
            const armsDiag = (b[cy - 3][cx - 1] || b[cy - 2][cx]) &&
                             (b[cy + 3][cx + 1] || b[cy + 2][cx]) &&
                             (b[cy - 1][cx + 3] || b[cy][cx + 2]) &&
                             (b[cy + 1][cx - 3] || b[cy][cx - 2]);

            if (armsDiag) {
              return "Unzulässiges Symbol erkannt (Gekipptes Hakenkreuz). Speichern verweigert.";
            }
          }
        }
      }

      // SS-Runen (Doppelblitz)
      for (let y = 3; y < GRID_SIZE - 6; y++) {
        for (let x = 2; x < GRID_SIZE - 7; x++) {
          const bolt1 = b[y][x+1] && b[y+1][x] && b[y+2][x+1] && b[y+3][x+2] && b[y+4][x+1] && b[y+5][x];
          const bolt2 = b[y][x+4] && b[y+1][x+3] && b[y+2][x+4] && b[y+3][x+5] && b[y+4][x+4] && b[y+5][x+3];

          if (bolt1 && bolt2) {
            return "Unzulässiges Symbol erkannt (SS-Runen-Muster). Speichern verweigert.";
          }
        }
      }

      return null;
    }

    /* --- SPEICHERN & LADEN --- */
    function getStoredFaces() {
      try {
        return JSON.parse(localStorage.getItem('deskbuddy_faces') || '[]');
      } catch (e) {
        return [];
      }
    }

    function renderStoredFaces() {
      const container = document.getElementById('customList');
      const faces = getStoredFaces();
      container.innerHTML = '';

      if (faces.length === 0) {
        container.innerHTML = '<span style="font-size:0.75rem; color:var(--text-dim); padding:4px;">Noch keine eigenen Faces.</span>';
        return;
      }

      faces.forEach((f, idx) => {
        const pill = document.createElement('div');
        pill.className = 'custom-pill';
        pill.innerHTML = `<span>${f.name}</span> <span class="del" onclick="deleteFace(event, ${idx})">✕</span>`;
        pill.onclick = () => {
          grid = JSON.parse(JSON.stringify(f.grid));
          document.getElementById('faceName').value = f.name;
          hideWarning();
          render();
        };
        container.appendChild(pill);
      });
    }

    function saveFace() {
      const nameInput = document.getElementById('faceName');
      const name = nameInput.value;

      const nameErr = validateName(name);
      if (nameErr) {
        showWarning(nameErr);
        return;
      }

      const patternErr = checkProhibitedPatterns();
      if (patternErr) {
        showWarning(patternErr);
        return;
      }

      const faces = getStoredFaces();
      const existingIdx = faces.findIndex(f => f.name.toLowerCase() === name.trim().toLowerCase());

      if (existingIdx >= 0) {
        faces[existingIdx].grid = JSON.parse(JSON.stringify(grid));
      } else {
        faces.push({ name: name.trim(), grid: JSON.parse(JSON.stringify(grid)) });
      }

      localStorage.setItem('deskbuddy_faces', JSON.stringify(faces));
      renderStoredFaces();
      hideWarning();
      alert(`„${name.trim()}“ wurde erfolgreich gespeichert!`);
    }

    function deleteFace(event, idx) {
      event.stopPropagation();
      const faces = getStoredFaces();
      faces.splice(idx, 1);
      localStorage.setItem('deskbuddy_faces', JSON.stringify(faces));
      renderStoredFaces();
    }

    function loadPreset(name) {
      grid = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill('#000000'));
      hideWarning();
      if (name === 'classic') {
        for(let y=7; y<=14; y++) for(let x=4; x<=8; x++) grid[y][x] = '#00f2fe';
        grid[8][8] = '#ffffff';
        for(let y=7; y<=14; y++) for(let x=15; x<=19; x++) grid[y][x] = '#00f2fe';
        grid[8][19] = '#ffffff';
        for(let x=10; x<=13; x++) grid[17][x] = '#00f2fe';
        document.getElementById('faceName').value = 'Standard';
      } else if (name === 'happy') {
        [4,5,6,7,8].forEach((x, i) => { grid[11 - (i > 2 ? 4-i : i)][x] = '#00ff87'; });
        [15,16,17,18,19].forEach((x, i) => { grid[11 - (i > 2 ? 4-i : i)][x] = '#00ff87'; });
        for(let x=9; x<=14; x++) grid[17][x] = '#ffb199';
        document.getElementById('faceName').value = 'Happy';
      } else if (name === 'laser') {
        for(let x=3; x<=20; x++) grid[11][x] = '#ff0844';
        for(let x=5; x<=18; x++) grid[10][x] = '#ff0844';
        document.getElementById('faceName').value = 'Laser';
      } else if (name === 'cat') {
        grid[5][4] = '#f6d365'; grid[6][5] = '#f6d365';
        grid[5][19] = '#f6d365'; grid[6][18] = '#f6d365';
        for(let y=9; y<=13; y++) for(let x=6; x<=8; x++) grid[y][x] = '#f6d365';
        for(let y=9; y<=13; y++) for(let x=15; x<=17; x++) grid[y][x] = '#f6d365';
        grid[15][11] = '#ffb199'; grid[15][12] = '#ffb199';
        document.getElementById('faceName').value = 'Katze';
      }
      render();
    }

    function exportData() {
      const patternErr = checkProhibitedPatterns();
      if (patternErr) {
        showWarning(patternErr);
        return;
      }
      const name = (document.getElementById('faceName').value.trim() || 'custom_face').replace(/[^a-zA-Z0-9_]/g, '_');
      alert(`Face „${name}“ steht bereit für den ESP32.`);
    }

    loadPreset('classic');
    renderStoredFaces();
  </script>
</body>
</html>
